    // Filters for separate pools
    function getAuctionPlayers() { return players.filter(p => p.role !== 'Owner' && p.retained !== 'Retained'); }
    function getLockedPlayers() { return players.filter(p => p.role === 'Owner' || p.retained === 'Retained'); }

    function checkLeagueExp(s1_team) {
        return (s1_team !== "First time" && s1_team !== "None / New");
    }

    function getMatchTier(matches) {
        if (matches === "" || matches === null || isNaN(matches)) return { label: "0-50", val: 1 };
        let m = parseFloat(matches);
        if (m <= 50) return { label: "0-50", val: 1 };
        if (m <= 100) return { label: "51-100", val: 2 };
        if (m <= 150) return { label: "101-150", val: 3 };
        if (m <= 200) return { label: "151-200", val: 4 };
        return { label: "200+", val: 5 };
    }

    // Advanced Alg Score Generator
    function calculatePowerScore(p) {
        let m = p.matches !== "" ? parseFloat(p.matches) : 0;
        let r = p.reliability !== "" ? parseFloat(p.reliability) : 0;
        let score = p.rating * 1000; 
        
        score += (m * 2); 
        score += (r * 3); 
        
        let ageModifier = 0;
        if (p.age < 50) { ageModifier = (50 - p.age) * 10; } 
        else if (p.age >= 60) { ageModifier = (60 - p.age) * 25; } 
        score += ageModifier;
        
        if (p.lp_rank === "High") score += 200;
        if (p.lp_rank === "Low") score -= 200;
        return Math.round(score);
    }

    function refreshScoresAndPots() {
        players.forEach(p => { p.alg_score = calculatePowerScore(p); });
        
        let allPlayers = [...players].sort((a, b) => b.alg_score - a.alg_score);

        allPlayers.forEach((p, index) => {
            let autoPotNumber = Math.floor(index / 6) + 1; // 1 to 10
            let mainPlayer = players.find(x => x.id === p.id);
            
            if(mainPlayer) {
                // If user hasn't manually edited the Pot, assign the calculated one
                if (!mainPlayer.potEdited) {
                    mainPlayer.potValue = autoPotNumber;
                }
                
                // Visual Pot Display
                if (mainPlayer.role === 'Owner' || mainPlayer.retained === 'Retained') {
                    mainPlayer.pot = "Locked";
                } else {
                    mainPlayer.pot = mainPlayer.potValue;
                }

                // Apply Standard Pricing unless manually edited
                if (!mainPlayer.priceEdited) {
                    mainPlayer.price = POT_PRICES[mainPlayer.potValue] || 800;
                }
            }
        });
    }

    function updateData(id, field, value) {
        let player = players.find(p => p.id === id);
        if (player) {
            if (field === 'rating') {
                player.rating = value === "" ? 0 : parseFloat(value);
                player.priceEdited = false; // Reset to let algorithm pick new standard price
                player.potEdited = false; // Reset pot algorithm
            } else if (field === 'price') {
                player.price = value === "" ? 0 : parseInt(value, 10);
                player.priceEdited = true; // Lock in manual price edit
            } else if (field === 'potValue') {
                player.potValue = parseInt(value, 10);
                player.potEdited = true; // Lock in manual pot selection
                if (!player.priceEdited) {
                    player.price = POT_PRICES[player.potValue] || 800; // Auto-update price to match new pot
                }
            } else if (field === 'matches' || field === 'reliability') {
                player[field] = value === "" ? "" : parseFloat(value);
                player.priceEdited = false; 
                player.potEdited = false;
            } else {
                player[field] = value;
            }
            renderTable();
        }
    }

    function sortPlayers(auctionOnly) {
        const sortType = document.getElementById("sortPriority").value;
        const getVal = (val, isAsc) => val === "" ? (isAsc ? 999999 : -1) : val;

        auctionOnly.sort((a, b) => {
            if (sortType === "alg_score") return b.alg_score - a.alg_score;
            if (sortType === "rating_desc") return b.rating - a.rating;
            if (sortType === "price_desc") return b.price - a.price;
            
            if (sortType === "tier_desc") {
                let tierA = getMatchTier(a.matches).val;
                let tierB = getMatchTier(b.matches).val;
                if (tierA !== tierB) return tierB - tierA; 
                return b.rating - a.rating; 
            }

            if (sortType === "league_exp") {
                let expA = checkLeagueExp(a.s1_team) ? 1 : 0;
                let expB = checkLeagueExp(b.s1_team) ? 1 : 0;
                if (expA !== expB) return expB - expA;
                return b.rating - a.rating; 
            }
            return 0;
        });
    }
    
    function updateDashboard() {
        let dashHTML = "";
        let lockedPlayers = getLockedPlayers();

        OFFICIAL_TEAMS.forEach(team => {
            let teamLocked = lockedPlayers.filter(p => p.team === team);
            let totalSpent = 0;
            let lockedHTML = `<div class="locked-list">`;
            
            if (teamLocked.length > 0) {
                teamLocked.forEach(p => {
                    totalSpent += p.price;
                    let roleIcon = p.role === 'Owner' ? '👑 Owner' : '🔒 Retained';
                    lockedHTML += `
                        <div class="locked-item">
                            <span class="locked-name">${roleIcon}: ${p.name} (Tier ${p.potValue})</span>
                            <span class="locked-price">-${p.price.toLocaleString()} LP</span>
                        </div>`;
                });
            } else {
                lockedHTML += `<div style="text-align:center; color:#95a5a6; font-style:italic;">No locked players</div>`;
            }
            lockedHTML += `</div>`;
            
            let count = teamLocked.length; 
            let remaining = STARTING_BUDGET - totalSpent;
            
            dashHTML += `
                <div class="team-card">
                    <div>
                        <h3>${team}</h3>
                        <div class="budget" style="color: ${remaining < 0 ? '#e74c3c' : '#2ecc71'}">${remaining.toLocaleString()} LP</div>
                        <div class="count">${count} Locked (Needs ${10 - count} Auction Picks)</div>
                    </div>
                    ${lockedHTML}
                </div>
            `;
        });
        document.getElementById('budgetDashboard').innerHTML = dashHTML;
    }

    function renderTable() {
        refreshScoresAndPots();
        
        let displayList = getAuctionPlayers();
        sortPlayers(displayList);
        
        updateDashboard();
        
        const tbody = document.getElementById('rosterTable');
        tbody.innerHTML = '';
        
        displayList.forEach((p, index) => {
            let tr = document.createElement('tr');
            
            let hasExp = checkLeagueExp(p.s1_team);
            let expHtml = hasExp ? '<span class="exp-yes">✅ Yes</span>' : '<span class="exp-no">❌ No</span>';
            let matchTier = getMatchTier(p.matches).label;
            
            let potClass = `pot-${p.potValue}`;

            let s1OptionsHtml = '';
            OFFICIAL_S1_TEAMS.forEach(t => {
                let isSelected = (p.s1_team === t);
                s1OptionsHtml += `<option value="${t}" ${isSelected ? 'selected' : ''}>${t}</option>`;
            });
            
            let potOptionsHTML = '';
            for(let i=1; i<=10; i++) {
                potOptionsHTML += `<option value="${i}" ${p.potValue === i ? 'selected' : ''}>Pot ${i}</option>`;
            }

            tr.innerHTML = `
                <td class="rank">${index + 1}</td>
                <td class="name-col">${p.name}</td>
                <td class="pot-container">
                    <select class="pot-select ${potClass}" onchange="updateData(${p.id}, 'potValue', this.value)">
                        ${potOptionsHTML}
                    </select>
                </td>
                <td class="score-col">${p.alg_score}</td>
                <td>
                    <select class="select-small select-s1" onchange="updateData(${p.id}, 's1_team', this.value)">
                        ${s1OptionsHtml}
                    </select>
                </td>
                <td>${expHtml}</td>
                <td>
                    <input type="number" step="0.01" min="0" max="10" placeholder="0.00" 
                           class="input-rating"
                           value="${p.rating.toFixed(2)}" 
                           onblur="updateData(${p.id}, 'rating', this.value)">
                </td>
                <td>
                    <input type="number" min="0" step="50" class="input-price" 
                           value="${p.price}" 
                           onblur="updateData(${p.id}, 'price', this.value)">
                </td>
                <td>
                    <input type="number" min="0" placeholder="0" 
                           value="${p.matches !== "" ? p.matches : ''}" 
                           onblur="updateData(${p.id}, 'matches', this.value)">
                </td>
                <td><span class="tier-badge">${matchTier}</span></td>
                <td>
                    <input type="number" min="0" max="100" placeholder="0%" 
                           value="${p.reliability !== "" ? p.reliability : ''}" 
                           onblur="updateData(${p.id}, 'reliability', this.value)">
                </td>
                <td>
                    <select class="select-small" onchange="updateData(${p.id}, 'lp_rank', this.value)">
                        <option value="High" ${p.lp_rank === 'High' ? 'selected' : ''}>High</option>
                        <option value="Medium" ${p.lp_rank === 'Medium' ? 'selected' : ''}>Medium</option>
                        <option value="Low" ${p.lp_rank === 'Low' ? 'selected' : ''}>Low</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function exportToCSV() {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Type,Alg Rank,Player Name,Draft Pot,S1 Team,League Exp,Live Rating,Base Price (LP),Alg Score,Matches,Match Tier,Reliability %,LP Rank,Role,Retained\n";
        
        let allExport = [...players];
        allExport.sort((a, b) => b.alg_score - a.alg_score);
        
        allExport.forEach((p, index) => {
            let isLocked = (p.role === 'Owner' || p.retained === 'Retained');
            let typeLabel = isLocked ? "LOCKED" : "AUCTION";
            let exp = checkLeagueExp(p.s1_team) ? "Yes" : "No";
            let tier = getMatchTier(p.matches).label;
            let m = p.matches !== "" ? p.matches : 0;
            let r = p.reliability !== "" ? p.reliability : 0;
            let potLabel = p.pot === "Locked" ? `Locked (Pot ${p.potValue})` : `Pot ${p.potValue}`;
            
            let row = `"${typeLabel}",${index + 1},"${p.name}","${potLabel}","${p.s1_team}","${exp}",${p.rating.toFixed(2)},${p.price},${p.alg_score},${m},"${tier}",${r},"${p.lp_rank}","${p.role}","${p.retained}"`;
            csvContent += row + "\n";
        });

        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "S2_Draft_Roster_Final.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    function exportToPDF() {
        const container = document.getElementById('printableArea');
        container.classList.add('pdf-mode');
        document.getElementById('hideForPrint').style.display = 'none';

        const opt = {
            margin:       0.3,
            filename:     'S2_Draft_Roster.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'in', format: 'a3', orientation: 'landscape' }
        };

        html2pdf().set(opt).from(container).save().then(() => {
            document.getElementById('hideForPrint').style.display = 'flex';
            container.classList.remove('pdf-mode');
        });
    }

    renderTable();
</script>
